<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xyon Consultings - Under Construction</title>
    <style>
        body, html { 
            height: 100%; margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f8f9fa; color: #333; 
            display: flex; align-items: center; justify-content: center; text-align: center; 
        }
        .container { 
            padding: 50px 40px; background: white; border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            max-width: 500px; width: 90%; 
        }
        h2 { 
            color: #0056b3; font-size: 1.1em; font-weight: 600; 
            margin-bottom: 15px; text-transform: uppercase; letter-spacing: 3px; 
        }
        h1 { 
            color: #2c3e50; font-size: 2.5em; margin-top: 0; margin-bottom: 20px; 
        }
        p { 
            color: #6c757d; line-height: 1.6; margin-bottom: 35px; font-size: 1.1em;
        }
        .loader { 
            border: 4px solid #e9ecef; border-top: 4px solid #0056b3; 
            border-radius: 50%; width: 40px; height: 40px; 
            animation: spin 1s linear infinite; margin: 0 auto; 
        }
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        } 
    </style>
</head>
<body>
    <div class="container">
        <h2>Xyon Consulting</h2>
        <h1>Under Construction</h1>
        <p>We are working hard to bring you a new and improved digital experience. Our website will be available soon.</p>
        <div class="loader"></div>
    </div>
</body>
</html>
